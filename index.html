<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>پێشەوا کولیچاوی</title>
<style>
  :root{
    --accent:#ff6600;
    --bg:#0c0c0c;
    --card: rgba(0,0,0,0.45);
    --green: #2ecc71;
    --red: #e74c3c;
    --white: #fff;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
  .container{max-width:980px;margin:0 auto;padding:18px}
  h1{color:var(--accent);text-align:center;margin:6px 0 16px;font-size:28px}

  /* welcome */
  #welcome{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:20px}
  #welcome p{max-width:760px;line-height:1.5}
  .primary{background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:bold}

  /* levels grid */
  .levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  @media(min-width:740px){.levels{grid-template-columns:repeat(4,1fr)}}
  .level-btn{position:relative;min-height:110px;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,0.06)}
  .level-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.45}
  .level-label{position:relative;z-index:2;padding:14px;font-weight:700}
  .locked{filter:grayscale(1);opacity:0.6;cursor:not-allowed;}
  .lock-icon{position:absolute;top:8px;right:8px;font-size:22px;z-index:3}

  /* question card */
  .question-card{display:none;margin:18px auto;border-radius:12px;overflow:hidden;max-width:800px;position:relative}
  .q-bg{width:100%;height:340px;object-fit:cover;display:block}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.6));}
  .q-content{position:relative;z-index:2;padding:16px}
  .q-text{font-size:20px;margin-bottom:12px}
  .answers{display:flex;flex-direction:column;gap:10px}
  .answers button{background:var(--accent);color:#fff;border:none;padding:12px 14px;border-radius:8px;font-size:16px;cursor:pointer;text-align:left}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .controls button{background:transparent;border:2px solid rgba(255,255,255,0.12);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
  .feedback{margin-top:10px;font-weight:700;min-height:20px}

  /* big badge */
  .bigBadge{
    position:absolute; left:50%; top:18px; transform:translateX(-50%);
    padding:12px 20px;border-radius:999px;font-size:20px;font-weight:800;z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,0.6); display:none;
  }

  /* overlays */
  #mediaOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:12px}
  #mediaOverlay iframe{width:100%;max-width:900px;height:auto;border-radius:10px}
  #jumpscareOverlay{display:none;position:fixed;inset:0;background:#000;z-index:10000;align-items:center;justify-content:center;cursor:pointer}
  #jumpscareOverlay img{max-width:100%;max-height:100%;object-fit:contain}
  .small-muted{opacity:0.8;font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
  <div class="container">
    <h1>پێشەوا کولیچاوی</h1>

    <div id="welcome">
      <p>سڵاو بەخێربێیت بۆ یاری کولیچە — ئەم یاریە دە پرسیارە و تەنها بۆ خۆشیە ڕێزم بۆ کاک پێشەواش هەیە. لەهەڵەکانمان ببورن و بەهیوای چێژ❤️</p>
      <button id="startBtn" class="primary">دەستپێکردن</button>
    </div>

    <div id="levelsScreen" class="levels" style="display:none"></div>

    <div id="questionCard" class="question-card" aria-hidden="true">
      <div class="bigBadge" id="bigBadge"></div>
      <img id="qBg" class="q-bg" src="" alt="background">
      <div class="overlay"></div>
      <div class="q-content">
        <div id="qText" class="q-text"></div>
        <div id="answers" class="answers"></div>
        <div id="videoContainer"></div>
        <div id="feedback" class="feedback"></div>

        <div class="controls">
          <button id="backBtn">گەڕانەوە بۆ ئاستەکان</button>
          <button id="retryBtn">دووبارە</button>
        </div>
        <div class="small-muted">تکایە لە سەر هەر لێکدانی جیهاندا هێرش و ڤۆڵیوم ڕێگ بگرە</div>
      </div>
    </div>
  </div>

  <div id="mediaOverlay" onclick="closeMedia()">
    <iframe id="mediaFrame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <div id="jumpscareOverlay" onclick="hideJumpscare()">
    <img id="scareImg" src="" alt="scare">
    <audio id="scareAudio" src=""></audio>
  </div>

<script>
/* ======== your data (same questions & backgrounds) ======== */
const backgrounds = [
  "https://i.ibb.co/cSN58rxn/Screenshot-20251112-164659-You-Tube.jpg",
  "https://i.ibb.co/twK5L3KT/Screenshot-20251112-165459-You-Tube.jpg",
  "https://i.ibb.co/YByK3Nbp/Screenshot-20251112-171818-Chrome.jpg",
  "https://i.ibb.co/pBqnFzJs/Screenshot-20251112-165529-You-Tube.jpg",
  "https://i.ibb.co/spjxD1Jb/Screenshot-20251112-171738-Chrome.jpg",
  "https://i.ibb.co/p6p9k034/Screenshot-20251112-194913-Chrome.jpg",
  "https://i.ibb.co/MyNp3mwd/Screenshot-20251112-194934-Chrome.jpg",
  "https://i.ibb.co/GfvTXz8v/Screenshot-20251112-195006-Chrome.jpg",
  "https://i.ibb.co/k2z9bXLV/Screenshot-20251112-194759-Chrome.jpg",
  "https://i.ibb.co/Jwgwf2XQ/Screenshot-20251112-194632-Chrome.jpg"
];

const quiz = [ /* keep your old questions here exactly */ ];

const welcome=document.getElementById('welcome');
const startBtn=document.getElementById('startBtn');
const levelsScreen=document.getElementById('levelsScreen');
const questionCard=document.getElementById('questionCard');
const qBg=document.getElementById('qBg');
const qText=document.getElementById('qText');
const answersEl=document.getElementById('answers');
const feedbackEl=document.getElementById('feedback');
const videoContainer=document.getElementById('videoContainer');
const bigBadge=document.getElementById('bigBadge');
const backBtn=document.getElementById('backBtn');
const retryBtn=document.getElementById('retryBtn');
const mediaOverlay=document.getElementById('mediaOverlay');
const mediaFrame=document.getElementById('mediaFrame');
const jumpscareOverlay=document.getElementById('jumpscareOverlay');
const scareImg=document.getElementById('scareImg');
const scareAudio=document.getElementById('scareAudio');

let currentIndex=0;
let unlocked=parseInt(localStorage.getItem("unlockedLevel"))||1; // saved progress

function saveProgress(){
  localStorage.setItem("unlockedLevel", unlocked);
}

function buildLevels(){
  levelsScreen.innerHTML='';
  for(let i=0;i<quiz.length;i++){
    const btn=document.createElement('button');
    btn.className='level-btn';
    btn.innerHTML=`<img src="${backgrounds[i]}"><span class="level-label">ئاست ${i+1}</span>`;
    if(i>=unlocked){btn.classList.add('locked');btn.innerHTML+=`<div class="lock-icon">🔒</div>`;}
    btn.addEventListener('click',()=>{if(i<unlocked) openLevel(i);});
    levelsScreen.appendChild(btn);
  }
}
buildLevels();

startBtn.onclick=()=>{welcome.style.display='none';levelsScreen.style.display='grid';};
backBtn.onclick=()=>{questionCard.style.display='none';levelsScreen.style.display='grid';buildLevels();};
retryBtn.onclick=()=>{openLevel(currentIndex);};

function openLevel(idx){
  currentIndex=idx;
  const item=quiz[idx];
  qBg.src=backgrounds[idx];
  qText.textContent=item.q;
  feedbackEl.textContent='';
  videoContainer.innerHTML='';
  bigBadge.style.display='none';
  levelsScreen.style.display='none';
  questionCard.style.display='block';
  answersEl.innerHTML='';
  item.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.textContent=opt;
    b.onclick=()=>onAnswer(i);
    answersEl.appendChild(b);
  });
}

function onAnswer(sel){
  const item=quiz[currentIndex];
  videoContainer.innerHTML='';
  hideMedia();hideJumpscare();
  bigBadge.style.display='block';

  if(sel===item.correct){
    bigBadge.textContent='ڕاستە';
    bigBadge.style.background='linear-gradient(90deg,#2ecc71,#16a085)';
    feedbackEl.textContent=item.feedback[sel];
    feedbackEl.style.color='var(--green)';

    if(currentIndex+1>unlocked && currentIndex+1<quiz.length){
      unlocked=currentIndex+1;
      saveProgress();
      setTimeout(()=>{alert(`ئاست ${unlocked+1} کراوە بوو ✅`);},400);
    }
    return;
  }

  bigBadge.textContent='هەڵەیە';
  bigBadge.style.background='linear-gradient(90deg,#e74c3c,#c0392b)';
  feedbackEl.textContent=item.feedback[sel];
  feedbackEl.style.color='var(--red)';

  if(item.wrongVideo){mediaFrame.src=item.wrongVideo;mediaOverlay.style.display='flex';}
  if(item.jumpscare){scareImg.src=item.jumpscare.img;scareAudio.src=item.jumpscare.sound;jumpscareOverlay.style.display='flex';scareAudio.play().catch(()=>{});}
}

/* overlays */
function closeMedia(){mediaOverlay.style.display='none';mediaFrame.src='';}
function hideMedia(){mediaOverlay.style.display='none';mediaFrame.src='';}
function hideJumpscare(){jumpscareOverlay.style.display='none';scareAudio.pause();scareAudio.currentTime=0;}
jumpscareOverlay.onclick=hideJumpscare;
mediaOverlay.onclick=closeMedia;
</script>
</body>
</html>
